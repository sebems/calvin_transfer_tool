    const InstitutionAutocomplete = ({ institutions, selectedId, onChange }) => {
      const [query, setQuery] = useState("");
      const [isOpen, setIsOpen] = useState(false);

      useEffect(() => {
        if (selectedId) {
          const inst = institutions.find(i => String(i.ReferenceID) === String(selectedId));
          if (inst) setQuery(inst.InstitutionName);
        } else {
          setQuery("");
        }
      }, [selectedId, institutions]);

      const filteredInstitutions = useMemo(() => {
        if (!query) return institutions;
        return institutions.filter(inst =>
          inst.InstitutionName.toLowerCase().includes(query.toLowerCase())
        );
      }, [query, institutions]);

      return html`
                <div class="relative">
                    <input
                        type="text"
                        class="w-full bg-white border border-gray-300 text-gray-900 rounded-md shadow-sm focus:border-calvin-maroon focus:ring focus:ring-calvin-maroon/20 py-2 px-3 text-sm transition-colors"
                        placeholder="Type to search institution..."
                        value=${query}
                        onInput=${e => {
          setQuery(e.target.value);
          setIsOpen(true);
          if (e.target.value === "") onChange("");
        }}
                        onFocus=${() => setIsOpen(true)}
                        onBlur=${() => setIsOpen(false)}
                    />

                    ${isOpen && html`

    // ==========================================

    const App = () => {
      const [institutions, setInstitutions] = useState([]);
      const [selectedInstId, setSelectedInstId] = useState("");
      const [courses, setCourses] = useState([]);
      const [loading, setLoading] = useState(false);
      const [search, setSearch] = useState("");
      const [cart, setCart] = useState(new Map());
      const [errorMsg, setErrorMsg] = useState("");

      // Load Institutions on Mount
      useEffect(() => {
        const loadInstitutions = async () => {
          try {
            const CACHE_KEY = "calvin_institution_cache";
            const cachedRaw = localStorage.getItem(CACHE_KEY);
            if (cachedRaw) {
              const cached = JSON.parse(cachedRaw);
              if (cached.data && isFresh(cached.timestamp)) {
                setInstitutions(cached.data);
                return;
              }
            }
            const response = await fetch(INSTITUTION_NO_AUTH_API_URL);
            if (!response.ok) throw new Error("Failed to fetch institutions");
            const result = await response.json();
            const data = result.Institutions || [];
            localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
            setInstitutions(data);
          } catch (e) {
            setErrorMsg("Institutions could not be loaded. Check API token or connection.");
          }
        };
        loadInstitutions();
      }, []);

      // Helper to fetch rules for a specific institution ID
      const fetchCoursesForInstitution = async (instId) => {
        const cached = courseCache.get(instId);
        if (cached && isFresh(cached.timestamp)) return cached.data;

        const response = await fetch(`${COURSE_NO_AUTH_API_URL}?InstitutionID=${encodeURIComponent(instId)}`);
        if (!response.ok) return [];
        const result = await response.json();
        const data = result.rules || [];
        courseCache.set(instId, { data, timestamp: Date.now() });
        return data;
      };

      // Load Courses (Selected Institution OR Global Search Across All)
      useEffect(() => {
        const loadCourses = async () => {
          // Case 1: Specific institution selected
          if (selectedInstId) {
            setLoading(true);
            setErrorMsg("");
            try {
              const data = await fetchCoursesForInstitution(selectedInstId);
              setCourses(data);
            } catch (e) {
              setErrorMsg("Courses could not be loaded for the selected institution.");
            } finally {
              setLoading(false);
            }
            return;
          }

          // Case 2: Global Search typed with NO institution selected
          if (!selectedInstId && search.trim().length >= 2) {
            setLoading(true);
            setErrorMsg("");
            try {
              // Query all institutions concurrently
              const allResults = await Promise.all(
                institutions.map(async (inst) => {
                  const instCourses = await fetchCoursesForInstitution(inst.ReferenceID);
                  return instCourses.map(c => ({
                    ...c,
                    _institutionName: inst.InstitutionName,
                    _institutionId: inst.ReferenceID
                  }));
                })
              );
              setCourses(allResults.flat());
            } catch (e) {
              setErrorMsg("Error searching across institutions.");
            } finally {
              setLoading(false);
            }
            return;
          }

          // Case 3: No institution selected & search cleared
          if (!selectedInstId && !search.trim()) {
            setCourses([]);
          }
        };

        const timeoutId = setTimeout(loadCourses, 300); // 300ms debounce for typing
        return () => clearTimeout(timeoutId);
      }, [selectedInstId, search, institutions]);

      // Live Filter
      const filteredCourses = useMemo(() => {
        if (!search) return courses;
        const lowerSearch = search.toLowerCase();
        return courses.filter(c => {
          const searchStr = (JSON.stringify(c) + " " + (c._institutionName || "")).toLowerCase();
          return searchStr.includes(lowerSearch);
        });
      }, [courses, search]);

      const toggleCart = (courseId, course) => {
        setCart(prev => {
          const next = new Map(prev);
          if (next.has(courseId)) {
            next.delete(courseId);
          } else {
            const instName = institutions.find(i => String(i.ReferenceID) === String(selectedInstId))?.InstitutionName || "External Institution";
            next.set(courseId, { ...course, institutionName: instName });
          }
          return next;
        });

        setCart(prev => {
          const next = new Map(prev);

          rowsHtml += `

                            </td>
                        </tr>
                    `;
          index++;
        });

        // PDF LAYOUT
        printContainer.innerHTML = `
                    <!-- Header Bar -->
                    <div style="background-color: #8c2232; padding: 18px 22px; border-radius: 6px 6px 0 0; color: #ffffff; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-family: 'Fjalla One', Arial, sans-serif; font-size: 24px; letter-spacing: 0.5px; text-transform: uppercase;">
                                Calvin University
                            </div>
                            <div style="font-size: 12px; color: #f2cd14; font-weight: 600; margin-top: 2px;">
                                Registrar's Office — Transfer Credit Evaluation Summary
                            </div>
                        </div>
                        <div style="text-align: right; font-size: 10px; color: #f3f4f6; line-height: 1.4;">
                            <div><strong>Date Generated:</strong> ${dateStr}</div>
                            <div><strong>Evaluated Institutions:</strong> ${instList}</div>
                        </div>
                    </div>

                    <div style="height: 4px; background-color: #f2cd14; margin-bottom: 20px;"></div>
                    <!-- Disclaimer Text -->
                    <p class="mb-3">If your school or courses are not in the list, we may still accept credit. Visit calvin.edu/go/creditevaluation to share your transcript and get one-on-one help.</p>

                    <!-- Evaluation Table -->
                    <table style="width: 100%; border-collapse: collapse; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 4px; overflow: hidden; margin-bottom: 20px;">
                        <thead>
                            <tr style="background-color: #282828; color: #ffffff; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">
                                <th style="padding: 10px 14px; text-align: left; font-weight: 700; width: 40%;">Transferring Course</th>
                                <th style="padding: 10px 10px; text-align: center; font-weight: 700; width: 20%;">Status & Credits</th>
                                <th style="padding: 10px 14px; text-align: left; font-weight: 700; width: 40%;">Calvin University Equivalent</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>

                    <!-- Summary & Official Disclaimer Footer -->
                    <div style="page-break-inside: avoid; background-color: #f9fafb; border: 1px solid #e5e7eb; border-left: 4px solid #8c2232; border-radius: 4px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
                        <div style="max-width: 65%;">
                            <div style="font-size: 11px; font-weight: 700; color: #8c2232; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">
                                Official Evaluation Notice
                            </div>
                            <div style="font-size: 10px; color: #4b5563; line-height: 1.45;">
                                This evaluation is an preliminary guide. Transfer credits remain subject to official transcript verification and review by the Calvin University Registrar's Office.
                            </div>
                        </div>
                        <div style="text-align: right; border-left: 1px solid #d1d5db; padding-left: 16px;">
                            <div style="font-size: 10px; color: #6b7280; font-weight: 600; text-transform: uppercase;">Total Selected Courses</div>
                            <div style="font-size: 16px; font-weight: 800; color: #111827; margin-bottom: 2px;">${cart.size}</div>
                            <div style="font-size: 10px; color: #6b7280; font-weight: 600; text-transform: uppercase;">Total Transfer Credits</div>
                            <div style="font-size: 18px; font-weight: 800; color: #8c2232;">${totalCredits}</div>
                        </div>
                    </div>
                `;

        const options = {
          margin: [0.3, 0.3, 0.3, 0.3],
          filename: "Calvin-Transfer-Credit-Evaluation.pdf",
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: { scale: 2, scrollY: 0, useCORS: true },
          jsPDF: { unit: "in", format: "letter", orientation: "portrait" },
          pagebreak: { mode: ["avoid-all", "css", "legacy"] }
        };

        html2pdf().set(options).from(printContainer).save();
      };

      return html`
                <div class="min-h-screen flex flex-col">
                    <${Header} />
                    <${Breadcrumb} />
                    <${IntroBanner} />
                    <main class="flex-1 max-w-[120rem] mx-auto w-full px-4 sm:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">

                        <!-- Left Sidebar -->
                        <div class="lg:col-span-3 space-y-6">
                            <div>
                                <label class="block font-bold text-gray-800 mb-2 text-sm">Institution Search:</label>
                                <${InstitutionAutocomplete}
                                    institutions=${institutions}
                                    selectedId=${selectedInstId}
                                    onChange=${setSelectedInstId}
                                />
                            </div>

                            <!-- Always Visible Course Search -->
                            <div>
                                <label for="course-search" class="block font-bold text-gray-800 mb-2 text-sm">Course Search:</label>
                                <input
                                    type="text"
                                    id="course-search"
                                    placeholder=${selectedInstId ? "Search within institution..." : "Global course search..."}
                                    class="w-full bg-white border border-gray-300 text-gray-900 rounded-md shadow-sm focus:border-calvin-maroon focus:ring focus:ring-calvin-maroon/20 py-2 px-3 text-sm transition-colors"
                                    value=${search}
                                    onInput=${e => setSearch(e.target.value)}
                                />
                            </div>

                            <hr class="border-gray-200" />

                            <button
                                type="button"
                                onClick=${handleExport}
                                class="w-full flex items-center justify-center gap-2 bg-calvin-maroon hover:bg-calvin-darkMaroon text-white font-medium py-2.5 px-4 rounded-md shadow-sm transition-colors text-sm"
                            >
                                <i class="bi bi-file-earmark-pdf text-base"></i> Export PDF
                            </button>
                        </div>

                        <!-- Main Content Area -->
                        <div class="lg:col-span-6">
                            ${errorMsg ? html`
                                <div class="bg-red-50 text-red-700 p-4 rounded-md border border-red-200 mb-4 text-sm">${errorMsg}</div>
                            ` : null}

                            ${loading ? html`
                                <div class="w-full bg-gray-200 rounded-full h-3 mb-4 overflow-hidden relative">
                                    <div class="bg-calvin-maroon h-3 rounded-full absolute left-0 top-0 animate-pulse w-full"></div>
                                </div>
                                <p class="text-sm text-gray-500 text-center">Loading courses...</p>
                            ` : html`
                                ${selectedInstId && courses.length === 0 && !errorMsg ? html`
                                    <div class="bg-yellow-50 text-yellow-800 p-4 rounded-md border border-yellow-200 mb-4 text-sm">
                                        No transfer courses were returned for this institution.
                                    </div>
                                ` : null}

                                <div class="space-y-4">
                                    ${filteredCourses.map((course, index) => {
        const courseId = course.internal_courses?.[0]?.course_id || `course-${index}`;
        return html`<${CourseCard} key=${courseId} course=${course} index=${index} inCart=${cart.has(courseId)} onToggleCart=${toggleCart} />`;
      })}
                                </div>
                            `}
                        </div>

                        <!-- Right Sidebar (Cart Summary) -->
                        <div class="lg:col-span-3">
                            <div class="bg-white rounded-lg shadow-sm border border-gray-200 sticky top-8 flex flex-col">
                                <div class="bg-gray-50 px-4 py-3 border-b border-gray-200 rounded-t-lg flex justify-between items-center">
                                    <span class="font-bold text-gray-800 text-sm">Selected Courses</span>
                                    <span class="bg-calvin-maroon text-white text-xs font-bold px-2.5 py-0.5 rounded-full">${cart.size}</span>
                                </div>

                                <div class="p-4 max-h-[60vh] overflow-y-auto">
                                    ${cart.size === 0 ? html`
                                        <div class="text-center text-gray-500 py-6 text-sm">No courses selected.</div>
                                    ` : html`
                                        <ul class="divide-y divide-gray-100">
                                            ${Array.from(cart.entries()).map(([courseId, course]) => html`
                                                <li key=${courseId} class="py-3 flex justify-between items-start gap-3">
                                                    <div class="flex-1 min-w-0">
                                                        <div class="font-bold text-calvin-maroon text-xs mb-0.5 truncate">${course.institutionName}</div>
                                                        <div class="font-medium text-xs text-gray-900 leading-tight mb-1">${getCourseLabel(course.internal_courses || [])}</div>
                                                        <div class="text-[0.7rem] text-gray-500 truncate">From: ${getCourseLabel(course.external_courses || [])}</div>
                                                    </div>
                                                    <button
                                                        type="button"
                                                        onClick=${() => removeFromCart(courseId)}
                                                        class="text-red-500 hover:text-red-700 transition-colors p-1"
                                                        title="Remove course"
                                                    >
                                                        <i class="bi bi-trash text-sm"></i>
                                                    </button>
                                                </li>
                                            `)}
                                        </ul>
                                    `}
                                </div>

                                <div class="p-4 bg-gray-50 border-t border-gray-200 rounded-b-lg flex justify-between items-center font-bold text-gray-900 text-sm">
                                    <span>Total Credits:</span>
                                    <span class="bg-gray-200 text-gray-800 text-xs px-2.5 py-1 rounded-full">${totalCredits}</span>
                                </div>
                            </div>
                        </div>

                        </main>

                        <${AboutTransfer} />
                        <${QuestionsAccordion} />
                        <${Footer} />
                </div>
            `;
    };

    render(html`<${App} />`, document.getElementById('app'));
  </script>
    </body>

</html>
