    const InstitutionAutocomplete = ({ institutions, selectedId, onChange, disabled = false }) => {
      const [query, setQuery] = useState("");
      const [isOpen, setIsOpen] = useState(false);

      useEffect(() => {
        if (selectedId) {
          const inst = institutions.find(i => String(i.ReferenceID) === String(selectedId));
          if (inst) setQuery(inst.InstitutionName);
        } else {
          setQuery("");
        }
      }, [selectedId, institutions]);

      const filteredInstitutions = useMemo(() => {
        if (!query) return institutions;
        return institutions.filter(inst =>
          inst.InstitutionName.toLowerCase().includes(query.toLowerCase())
        );
      }, [query, institutions]);

      return html`
                <div class="relative">
                    <input
                        type="text"
                        disabled=${disabled}
                        class="w-full bg-white border border-gray-300 text-gray-900 rounded-md shadow-sm focus:border-calvin-maroon focus:ring focus:ring-calvin-maroon/20 py-2 px-3 text-sm transition-colors disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed"
                        placeholder=${disabled ? "Disabled during global course search" : "Type to search institution..."}
                        value=${query}
                        onInput=${e => {
                            if (disabled) return;
                            setQuery(e.target.value);
                            setIsOpen(true);
                            if (e.target.value === "") onChange("");
                        }}
                        onFocus=${() => !disabled && setIsOpen(true)}
                        onBlur=${() => setIsOpen(false)}
                    />

                    ${isOpen && !disabled && html`
                        <ul class="absolute z-20 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-auto text-sm">
                            ${filteredInstitutions.length === 0 ? html`
                                <li class="px-3 py-2 text-gray-500 italic">No institutions found</li>
                            ` : filteredInstitutions.map(inst => html`
                                <li
                                    key=${inst.ReferenceID}
                                    class=${`px-3 py-2 cursor-pointer hover:bg-calvin-maroon hover:text-white transition-colors ${String(inst.ReferenceID) === String(selectedId) ? 'bg-gray-100 font-semibold' : ''}`}
                                    onMouseDown=${(e) => {
            e.preventDefault();
            onChange(inst.ReferenceID);
            setQuery(inst.InstitutionName);
            setIsOpen(false);
          }}
                                >
                                    ${inst.InstitutionName}
                                </li>
                            `)}
                        </ul>
                    `}
                </div>
            `;
    };

    // ==========================================
    // MAIN APPLICATION COMPONENT
    // ==========================================
    const App = () => {
      const [institutions, setInstitutions] = useState([]);
      const [selectedInstId, setSelectedInstId] = useState("");
      const [courses, setCourses] = useState([]);
      const [loading, setLoading] = useState(false);
      const [search, setSearch] = useState("");
      const [cart, setCart] = useState(new Map());
      const [errorMsg, setErrorMsg] = useState("");
      const isGlobalCourseSearch = !selectedInstId && search.trim().length > 0;

      // Load Institutions on Mount
      useEffect(() => {
        const loadInstitutions = async () => {
          try {
            const CACHE_KEY = "calvin_institution_cache";
            const cachedRaw = localStorage.getItem(CACHE_KEY);
            if (cachedRaw) {
              const cached = JSON.parse(cachedRaw);
              if (cached.data && isFresh(cached.timestamp)) {
                setInstitutions(cached.data);
                return;
              }
            }
            const response = await fetch(INSTITUTION_NO_AUTH_API_URL);
            if (!response.ok) throw new Error("Failed to fetch institutions");
            const result = await response.json();
            const data = result.Institutions || [];
            localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
            setInstitutions(data);
          } catch (e) {
            setErrorMsg("Institutions could not be loaded. Check API token or connection.");
          }
        };
        loadInstitutions();
      }, []);

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        const fetchGlobalCourses = async () => {
            const cacheKey = `global_courses`;
            const cachedRaw = localStorage.getItem(cacheKey);

            if (cachedRaw) {
                const cached = JSON.parse(cachedRaw);

                if (cached.data && isFresh(cached.timestamp)) {
                    return cached.data;
                }
            }

            const response = await fetchWithRetry(GLOBAL_COURSE_SEARCH_API_URL);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const result = await response.json();
            const schools = result.response?.schools || result.schools || [];

            // Flatten schools[].rules[] into a single array of rule objects
            const data = schools.flatMap(school =>
                (school.rules || []).map(rule => ({
                    ...rule,
                    institution: school.institution || "",
                    institution_ref_id: school.institution_ref_id || ""
                }))
            );

            localStorage.setItem(
                cacheKey,
                JSON.stringify({
                    data,
                    timestamp: Date.now()
                })
            );

            return data;
        };

        const fetchWithRetry = async (url, maxRetries = 3) => {
            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                const response = await fetch(url);

                if (response.ok) {
                    return response;
                }

                if (response.status !== 429 || attempt === maxRetries) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const retryAfter = response.headers.get("Retry-After");

                const delay = retryAfter
                    ? Number(retryAfter) * 1000
                    : Math.pow(2, attempt) * 1000 + Math.random() * 500;

                console.warn(`Rate limited. Retrying in ${Math.round(delay)}ms`);

                await sleep(delay);
            }
        };

      // Helper to fetch rules for a specific institution ID
        const fetchCoursesForInstitution = async (instId) => {
            const cacheKey = `courses_${instId}`;
            const cachedRaw = localStorage.getItem(cacheKey);

            if (cachedRaw) {
                const cached = JSON.parse(cachedRaw);

                if (cached.data && isFresh(cached.timestamp)) {
                    return cached.data;
                }
            }

            const response = await fetchWithRetry(
                `${COURSE_NO_AUTH_API_URL}?InstitutionID=${encodeURIComponent(instId)}`
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const result = await response.json();

            const data = (result.response?.rules || result.rules || []).map(rule => ({
                ...rule,
                institution: result.institution || "",
                institution_ref_id: result.institution_ref_id || ""
            }));

            localStorage.setItem(
                cacheKey,
                JSON.stringify({
                    data,
                    timestamp: Date.now()
                })
            );
            return data;
        };

      // Load Courses (Selected Institution OR Global Search Across All)
      useEffect(() => {
        const loadCourses = async () => {
            // Selected institution: fetch once, then filter locally
            if (selectedInstId) {
                setLoading(true);
                setErrorMsg("");

                try {
                    const data = await fetchCoursesForInstitution(selectedInstId);
                    setCourses(data);
                } catch (e) {
                    setErrorMsg("Courses could not be loaded for the selected institution.");
                } finally {
                    setLoading(false);
                }

                return;
            }

            // Global search
            if (search.trim().length >= 3) {
                setLoading(true);
                setErrorMsg("");

                try {
                    const data = await fetchGlobalCourses();
                    setCourses(data);
                } catch (e) {
                    setErrorMsg("Error searching across institutions.");
                } finally {
                    setLoading(false);
                }

                return;
            }

            setCourses([]);
        };

        const timeoutId = setTimeout(loadCourses, 500);

        return () => clearTimeout(timeoutId);
    }, [selectedInstId, search]);

      // Live Filter
      const filteredCourses = useMemo(() => {

            return courses.filter(c => {
                const searchable = [
                    c.institution,
                    ...(c.external_courses || []).flatMap(item => [item.course_id, item.course_title]),
                    ...(c.internal_courses || []).flatMap(item => [item.course_id, item.course_title]),
                    c.core_requirement
                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();

                return searchable.includes(term);

        }, [courses, search]);

      const removeFromCart = (courseId) => {

      const toggleCart = (courseId, course) => {
            setCart(prev => {
                const next = new Map(prev);

      const totalCredits = useMemo(() => {

      }, [cart]);

      // Determine the single status banner to show (null when cards should display normally)

            // 2. Global search typed, but fewer than 3 characters

                return {
                    style: "bg-gray-100 text-gray-700 border-gray-200",

            if (selectedInstId && courses.length === 0) {
                return {
                    style: "bg-yellow-50 text-yellow-800 border-yellow-200",
                    text: "No transfer courses were returned for this institution."
                };
            }

            // 4. Courses exist (from institution or global fetch), but search filter matched 0
            if (filteredCourses.length === 0) {
                return {
                    style: "bg-yellow-50 text-yellow-800 border-yellow-200",
                    text: `No transfer courses match "${trimmedSearch}".`
                };
            }

            return null;
        })();

      const handleExport = () => {
    if (cart.size === 0) {
        alert("Please select at least one course before exporting.");
        return;
    }

    if (!window.jspdf?.jsPDF) {
        alert("PDF export library failed to load. Please refresh the page and try again.");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter", orientation: "portrait" });

    const pageWidth = doc.internal.pageSize.getWidth();   // 612 pt
    const pageHeight = doc.internal.pageSize.getHeight(); // 792 pt
    const marginX = 32;
    const contentWidth = pageWidth - marginX * 2;

    // Calvin Brand Palette matching your HTML template
    const MAROON = [140, 34, 50];        // #8c2232
    const GOLD = [242, 205, 20];         // #f2cd14
    const CHARCOAL = [40, 40, 40];       // #282828
    const DARK_TEXT = [17, 24, 39];      // #111827
    const BODY_TEXT = [31, 41, 55];      // #1f2937
    const MUTED_TEXT = [75, 85, 99];     // #4b5563
    const SUBTLE_TEXT = [107, 114, 128]; // #6b7280
    const LIGHT_BG = [249, 250, 251];    // #f9fafb
    const ZEBRA_BG = [252, 252, 252];    // #fcfcfc
    const BORDER = [229, 231, 235];      // #e5e7eb
    const BADGE_BG = [254, 243, 199];    // #fef3c7
    const BADGE_BORDER = [253, 230, 138];// #fde68a
    const BADGE_TEXT = [146, 64, 14];    // #92400e

    const dateStr = new Date().toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
    });

    doc.rect(marginX, headerTop + headerHeight - 6, contentWidth, 6, "F");

    // Gold accent bar

    doc.rect(marginX, headerTop + headerHeight, contentWidth, 4, "F");

    // Right metadata
    doc.setTextColor(243, 244, 246);

    doc.text(metaLines, pageWidth - marginX - 16, headerTop + 22, { align: "right" });

    let currentY = headerTop + headerHeight + 20;

    currentY += 16;

    // ==========================================

    const col0Width = contentWidth * 0.40;

    // Measure & draw External Course cell (bold code, gray title, maroon institution)
    const processExternalCell = (course, cellWidth, draw = false, x = 0, y = 0) => {
        const innerW = cellWidth - padX * 2;

            ? course.external_courses
            : [{ course_id: "External Course", course_title: "No external course" }];

        let cursorY = y + padY;

            if (idx > 0) {

            if (draw) {

        // Maroon institution footer inside cell
        cursorY += 4;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(8);
        const instLines = doc.splitTextToSize(course.institution || "External Institution", innerW);
        if (draw) {
            doc.setTextColor(...MAROON);
            doc.text(instLines, x + padX, cursorY + 7);
        }
        cursorY += instLines.length * 10 + padY;

        return cursorY - y;
    };

    // Measure & draw Status & Credits cell (amber core badge + centered credits)
    const processStatusCell = (course, cellWidth, cellHeight = 0, draw = false, x = 0, y = 0) => {

        const credits = Number.isFinite(Number(course.credit_hours)) ? Number(course.credit_hours) : 0;
        const creditText = `${credits} ${credits === 1 ? "Credit" : "Credits"}`;

        const totalContentH = badgeBoxH + (badgeBoxH ? 6 : 0) + 11;
        // Vertically center content when drawing
        let cursorY = draw && cellHeight > totalContentH
            ? y + (cellHeight - totalContentH) / 2
            : y + padY;

        if (course.core_requirement) {

                doc.setFillColor(...BADGE_BG);
                doc.setDrawColor(...BADGE_BORDER);
                doc.setLineWidth(0.5);

                doc.setFontSize(7.5);
                doc.text(badgeLines, x + cellWidth / 2, cursorY + 9.5, { align: "center" });

            cursorY += badgeBoxH + 6;

        if (draw) {
            doc.setTextColor(...SUBTLE_TEXT);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8.5);

                cursorY += 7;

            // Bold maroon Calvin course ID
            doc.setFont("helvetica", "bold");

            // Medium-dark course title
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8.5);
            const titleLines = doc.splitTextToSize(internal.course_title || "Equivalent Calvin Course", innerW);
            if (draw) {
                doc.setTextColor(...BODY_TEXT);
                doc.text(titleLines, x + padX, cursorY + 7);
            }
            cursorY += titleLines.length * 10.5;

            // Core requirement sub-note
            if (internal.is_core) {
                cursorY += 3;
                doc.setFont("helvetica", "normal");
                doc.setFontSize(7.5);
                if (draw) {
                    doc.setTextColor(...SUBTLE_TEXT);
                    doc.text("Fulfills Core Requirement", x + padX, cursorY + 6);

    // ==========================================
    doc.autoTable({

        head: [["TRANSFERRING COURSE", "STATUS & CREDITS", "CALVIN UNIVERSITY EQUIVALENT"]],
        body: sortedCourses.map(() => ["", "", ""]),
        theme: "plain",
        headStyles: {
            fillColor: CHARCOAL,
            textColor: [255, 255, 255],
            fontStyle: "bold",
            fontSize: 8,
            cellPadding: { top: 8, bottom: 8, left: padX, right: padX }
        },
        columnStyles: {
            0: { cellWidth: col0Width },
            1: { cellWidth: col1Width, halign: "center" },
            2: { cellWidth: col2Width }
        },
        // Pre-compute exact row height from our custom rich content
        didParseCell: (data) => {
            if (data.section === "head" && data.column.index === 1) {
                data.cell.styles.halign = "center";
            }
            if (data.section === "body") {
                const course = sortedCourses[data.row.index];
                const h0 = processExternalCell(course, col0Width, false);
                const h1 = processStatusCell(course, col1Width, 0, false);
                const h2 = processInternalCell(course, col2Width, false);
                data.cell.styles.minCellHeight = Math.max(h0, h1, h2);

        },
        // Draw zebra background, bottom border, and styled multi-font text
        didDrawCell: (data) => {
            if (data.section !== "body") return;

            const course = sortedCourses[data.row.index];
            const { x, y, width, height } = data.cell;

            // Zebra striping matching #ffffff / #fcfcfc
            doc.setFillColor(...(data.row.index % 2 === 0 ? [255, 255, 255] : ZEBRA_BG));
            doc.rect(x, y, width, height, "F");

            // Outer left/right border & bottom row border
            doc.setDrawColor(...BORDER);
            doc.setLineWidth(0.5);
            doc.line(x, y + height, x + width, y + height);
            if (data.column.index === 0) {
                doc.line(x, y, x, y + height);
            }
            if (data.column.index === 2) {
                doc.line(x + width, y, x + width, y + height);
            }

            if (data.column.index === 0) {
                processExternalCell(course, width, true, x, y);
            } else if (data.column.index === 1) {
                processStatusCell(course, width, height, true, x, y);
            } else if (data.column.index === 2) {
                processInternalCell(course, width, true, x, y);
            }

    // ==========================================
    let finalY = doc.lastAutoTable.finalY + 18;

    doc.setFillColor(...LIGHT_BG);
    doc.setDrawColor(...BORDER);
    doc.setLineWidth(0.75);
    doc.roundedRect(marginX, finalY, contentWidth, footerBoxHeight, 4, 4, "FD");

    doc.setFillColor(...MAROON);
    doc.rect(marginX, finalY, 4, footerBoxHeight, "F");

    doc.setTextColor(...MAROON);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.5);
    doc.text("OFFICIAL EVALUATION NOTICE", marginX + 14, finalY + 18);

    );

    const totalPages = doc.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {

    }

    const fileDate = new Date().toISOString().slice(0, 10);
    doc.save(`Calvin-Transfer-Credit-Evaluation-${fileDate}.pdf`);
};
      return html`

                                        type="button"
                                        onClick=${handleExport}
                                        class="w-full flex-1 items-center justify-center gap-2 bg-calvin-maroon hover:bg-calvin-darkMaroon text-white font-medium py-2.5 px-4 shadow-sm transition-colors text-sm "
                                        >
                                        <i class="bi bi-file-earmark-pdf text-base"></i> Export PDF
                                        </button>

                                        <button
                                            type="button"
                                            class="text-calvin-maroon hover:text-calvin-darkMaroon font-medium text-sm flex-1 border-2 border-calvin-maroon py-2.5 px-4 transition-colors"
                                            onClick=${() => {
                                                setCart(new Map());
                                            }}
                                        >
                                            Reset <i class="bi bi-arrow-counterclockwise"></i>
                                        </button>
                                    </div>
                                </div>
                                
                        </div>

                        </main>

                        <${QuestionsAccordion} />
                        <${Footer} />
                </div>
            `;
    };

    render(html`<${App} />`, document.getElementById('app'));
  </script>
    </body>

</html>
